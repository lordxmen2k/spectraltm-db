name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install spectraltm (Rust SSE engine)
        # spectraltm-db depends on the spectraltm PyPI wheel which is
        # published separately. We pull the latest stable release.
        run: python -m pip install --upgrade "spectraltm>=0.1.2"

      - name: Install spectraltm-db (dev mode)
        run: |
          python -m pip install -e ".[all]"
          python -m pip install pytest

      - name: Smoke import
        run: python -c "import spectraltm_db as stm; print(stm.__version__)"

      - name: Run unit + integration tests
        run: pytest tests/ -q --tb=short --basetemp=/tmp/stm-pytest

      - name: Smoke CLI
        run: |
          python -m spectraltm_db --help
          mkdir -p /tmp/cli-smoke
          python -m spectraltm_db create cli_smoke \
            --dimension 32 --compression spectral_k64 --path /tmp/cli-smoke
          python -m spectraltm_db stats cli_smoke --path /tmp/cli-smoke
