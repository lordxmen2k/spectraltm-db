[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectraltm-db"
version = "0.1.1"
description = "Pinecone-shaped local vector database on top of the SpectralTM Rust crate (Sparse Spectral Encoding cold-tier compression)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gerald Enrique Nelson Mc Kenzie", email = "lordxmen2k@gmail.com" },
]
keywords = [
    "vector-database",
    "semantic-search",
    "rag",
    "pinecone",
    "spectral-encoding",
    "cold-tier",
    "memory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ---- Runtime deps (kept minimal — see spectraltm_db_spec.md §14) ----
dependencies = [
    "spectraltm>=0.1.1",     # Rust SSE encoder + SpectralIndex AVX2 scorer
    "numpy>=1.24",
    "msgpack>=1.0.7",
]

# ---- Optional extras ----
[project.optional-dependencies]
# Auto-embedding via sentence-transformers (NOT a hard dep — pulls in torch).
encoder = ["sentence-transformers>=2.2"]
# RAG framework adapters — installed lazily; require the framework at runtime.
langchain = ["langchain-core>=0.1"]
llamaindex = ["llama-index-core>=0.10"]
# Built-in REST server (FastAPI + uvicorn). Optional so the wheel stays lean
# when only in-process Index() is used.
server = ["fastapi>=0.110", "uvicorn>=0.27"]
# Everything, dev-friendly.
all = [
    "sentence-transformers>=2.2",
    "langchain-core>=0.1",
    "llama-index-core>=0.10",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.urls]
Homepage = "https://github.com/lordxmen2k/sparse-spectral-encoding"
# "Source" intentionally not set yet — repo split is being decided.

[tool.setuptools.packages.find]
namespaces = false
